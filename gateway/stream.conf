# TCP tunnel for PostgreSQL through the gateway.
# Security policy: DB port is not exposed directly by the db container.
server {
    listen 5432;
    proxy_pass db:5432;

    # Stream logs let us audit DB access through the single entrypoint.
    access_log /var/log/nginx/stream-access.log;
    error_log /var/log/nginx/stream-error.log warn;
}
