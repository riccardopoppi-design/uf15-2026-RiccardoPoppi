# Docker internal DNS for runtime name resolution.
resolver 127.0.0.11 valid=10s ipv6=off;

# Dynamic target selection:
# - default => Blue
# - canary/test requests can force Green via header: X-Backend-Target: green
map $http_x_backend_target $backend_api {
    default http://sio-backend-blue:3000;
    ~*green http://sio-backend-green:3000;
    ~*blue  http://sio-backend-blue:3000;
}

# AMBIENTE PROD
server{
    listen 80;
    server_name localhost;
    location / {
        proxy_pass http://fe-prod:80;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_api;
    }
}

# AMBIENTE TEST
server{
    listen 8080;
    location / {
        proxy_pass http://fe-test:80;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_api;
    }
}

# AMBIENTE SVI
server{
    listen 8999;
    location / {
        proxy_pass http://fe-sio:80;
    }
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_api;
    }
}
