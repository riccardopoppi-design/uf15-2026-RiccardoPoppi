<div class="flex flex-col gap-6">
  <his-patient-search
    (patientSelected)="onPatientSelected($event)"
    (newPatient)="openNewPatientForm()"
  ></his-patient-search>

  @if (showForm()) {
    <his-accettazione-form
      [selectedPatient]="selectedPatient()"
      (closed)="onFormClosed()"
    ></his-accettazione-form>
  }
</div>
